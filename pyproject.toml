[project]
name = "ticketflow"
version = "0.1.0"
description = "A PostgreSQL-backed event ticketing API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "email-validator>=2.2,<3",
  "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.18,<1", "qrcode[pil]>=8,<9",
  "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"]

